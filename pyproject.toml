[project]
name = "akshare-one"
version = "0.7.0"
description = "Standardized interface for Chinese financial market data, built on AKShare with unified data formats and simplified APIs"
readme = "README.md"
# 3.11.5 rather than 3.10: the transitive security fixes for soupsieve
# (>=4.0.0, needed for GHSA-mmhr-3c5m-f64f) publish as >=3.11.5, so a 3.10 leg
# could only ever resolve the vulnerable release. Python 3.10 itself reached
# end of life on 2026-10-01, so nothing is lost by dropping it.
requires-python = ">=3.11.5"
dependencies = [
    # Only a floor, deliberately: akshare renames interfaces without a
    # deprecation window, so pinning to one release trades one breakage for
    # another. akshare_one.modules.compat resolves each rename at call time,
    # which keeps this floor and every newer release working. 1.18.1 is the
    # first release PyPI has in the 1.18 line, so it is the real floor.
    "akshare>=1.18.1",
    # Imported directly by akshare_one (akshare also pulls these in, but we
    # depend on them explicitly so the package keeps working if akshare
    # changes its dependency set).
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "cachetools>=5.5.0",
    # akshare requests `Accept-Encoding: gzip, deflate, br` on some endpoints
    # (e.g. XueQiu) but does not declare brotli; without it those responses
    # cannot be decoded and JSON parsing fails.
    "brotli>=1.1.0",
]
license = "MIT"
keywords = ["akshare", "financial-data", "stock-data", "quant"]

[project.urls]
Homepage = "https://github.com/zwldarren/akshare-one"
Repository = "https://github.com/zwldarren/akshare-one.git"

[project.optional-dependencies]
talib = ["ta-lib>=0.6.4"]

[dependency-groups]
dev = [
    "zensical>=0.0.62",
    "pandas-stubs>=2.3.0.250703",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.3.1",
    "ruff>=0.12.1",
    "ty>=0.0.10",
    "types-cachetools>=6.1.0.20250717",
    "types-requests>=2.32.4.20250809",
]

[build-system]
requires = ["uv_build>=0.8.12,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=akshare_one --cov-report=term-missing"
# Live-provider tests are skipped unless --run-network is passed (see
# tests/conftest.py). The timeout keeps a hung upstream request from stalling
# the whole run.
timeout = 180

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.pyright]
typeCheckingMode = "standard"

# ty is the type checker this project actually runs in CI. The mypy config that
# used to sit here claimed `strict = true` while mypy was neither installed nor
# invoked anywhere, so it checked nothing and 34 errors had accumulated behind
# it.
[tool.ty]
# Importing talib is the point of this module: factory.py tries the import and
# falls back to the pure-pandas calculators when it fails. It lives in an
# optional extra, so a plain `uv sync` leaves it uninstalled and ty cannot
# resolve it.
[[tool.ty.overrides]]
include = ["src/akshare_one/modules/indicators/talib.py"]
[tool.ty.overrides.rules]
import-not-found = "ignore"
