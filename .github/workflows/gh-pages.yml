name: Deploy docs via GitHub Pages

# Docs are built with Zensical, the successor to Material for MkDocs. It reads
# the existing mkdocs.yml, so no config migration was required.
on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  pages: write
  contents: write

# Every push to main deploys. When several land within a few seconds — a batch of
# dependabot merges, for instance — the runs race and the losers fail in
# deploy-pages with "Found 0 artifact(s)", which reads like a broken docs build
# when the build itself was fine. Deploy one at a time, newest last so the final
# state of main is what gets published.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Build documentation
        run: |
          zensical build --clean
          zensical --version

      - name: Adjust permissions
        run: |
          chmod -c -R +rX site/ | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
