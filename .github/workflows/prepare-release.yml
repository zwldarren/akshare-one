name: Prepare release

# Cut a release from dev without touching pyproject.toml by hand. Bumps the
# version, commits it, pushes the vX.Y.Z tag, then dispatches release.yml at
# that tag (a GITHUB_TOKEN tag push does not trigger the push event itself).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the leading v)"
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --no-cov

      - name: Validate version input
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '${{ inputs.version }}'"
            exit 1
          fi
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv version "${{ inputs.version }}"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): bump version to ${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:"${GITHUB_REF_NAME}" "v${{ inputs.version }}"

      - name: Trigger release workflow
        run: |
          gh workflow run release.yml --ref "v${{ inputs.version }}"
          sleep 5
          gh run list --workflow=release.yml --limit 1
        env:
          GH_TOKEN: ${{ github.token }}
